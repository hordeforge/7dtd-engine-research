# Static analysis for the Python RE tooling and gates (ruff).
# Enforced by `make lint` locally (check + format) and the ci.yml lint job;
# keep both on the same pinned version (see the workflow) so local and CI agree.
line-length = 100

[lint]
# Correctness core (pycodestyle errors, pyflakes), bug-prone patterns
# (bugbear), import hygiene, and groups the tree already passes clean.
# Raise this set only together with the fixes that keep the tree green;
# never park a red rule group here.
select = [
    "E4",  # pycodestyle errors (imports, indentation, whitespace)
    "E7",  # pycodestyle statement-level errors
    "E9",  # pycodestyle runtime/syntax errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear (bug-prone constructs)
    "A",   # flake8-builtins (builtin shadowing)
    "N",   # pep8-naming
    "I",   # import sorting
    "C4",  # flake8-comprehensions
    "ICN", # import conventions
    "PT",  # pytest style
    "TID", # tidy imports
    "ISC", # implicit string concat (accidental literal joining)
    "G",   # logging format-string correctness
    "LOG", # logging misuse (f-strings in the message, f-string in exc_info)
    "ASYNC", # blocking calls inside async functions
    "RET", # return-path consistency (superfluous else/finally, unreachable code)
    "ARG", # unused arguments: a dropped parameter is a silently dead contract
    "SIM", # simplifications that hide a branch or an exception path
    "PGH", # blanket noqa/fixme suppression hygiene
    "PLE", # pylint errors (real-defect subset)
    "RSE", # unnecessary parens on raised exceptions
    "SLF", # private member access from outside the class
    "YTT", # sys.version/version_info misuse
    "DTZ", # naive datetime (missing tz)
    "FLY", # literal joins
    "EXE", # shebang/executable-bit consistency for script-style gates
    "RUF", # ruff-specific rules
    "FA",  # `from __future__ import annotations`: without it, PEP 585/604
           # annotations in signatures are evaluated at def time, so a module
           # that imports a name only under TYPE_CHECKING crashes on import
    "Q",   # quote style, so hand-written strings match the double-quote
           # formatter instead of drifting back to single quotes
    "PD",  # pylint deprecations (badly deprecated cgi/imp/etc. imports)
    "NPY", # numpy legacy np.* aliases (np.float, np.bool) removed in 2.0
    "SLOT", # __slots__ shape errors (typos, non-str members)
]

[lint.per-file-ignores]
# Script-style gates insert their own directory into sys.path before
# importing the shared _common helper, so module-level imports legitimately
# follow executable setup statements there.
"tools/tests/**" = ["E402"]
# Every parser in the SECTION_SPECS table takes (text, unparsed) so the driver
# calls them uniformly, and HEALTH_RE only matches \d+, so some parsers have
# nothing to record. Renaming the parameter would break the table's symmetry
# without changing what the gate checks.
"tools/xml_pins.py" = ["ARG001"]

[format]
# De-facto Python formatter, same pinned ruff binary as the lint gate
# (`ruff format --check .` in `make lint`). Defaults: magic trailing comma,
# double quotes; whitespace and indentation style is mechanical from here on.
quote-style = "double"
