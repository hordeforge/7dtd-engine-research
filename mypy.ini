# Static-type gate for the Python RE tooling and gates (mypy).
# Enforced by `make lint` locally and the ci.yml lint job; keep both on the
# same pinned version (see the workflow) so local and CI agree.
[mypy]
python_version = 3.12
strict = True
mypy_path = tools

# Strict mode's defaults, plus the error codes it leaves off. Every code here
# is green on the tree; raise the set only together with the fixes that keep it
# green. ignore-without-code matters most: a bare `# type: ignore` names no
# rule, so nothing records what it silences or what to delete once the finding
# is gone. (ini takes one comma-separated line, not the multi-line list form.)
enable_error_code = deprecated, explicit-override, ignore-without-code, mutable-override, narrowed-type-not-subtype, overload-overlap, possibly-undefined, redundant-expr, truthy-bool, unimported-reveal, unused-awaitable

# UnityPy / dnfile / dncil ship no type information, and they are optional
# extras (the gates that need them exit 77 when absent), so their surfaces
# stay Any at the import boundary rather than gaining vendored stubs. Scoped
# per module, not globally: a repo-wide ignore_missing_imports hides a typo'd
# or newly dropped dependency behind silence, and a mistyped import is exactly
# the defect strict mode is here to catch.
[mypy-UnityPy.*]
ignore_missing_imports = True

[mypy-dnfile.*]
ignore_missing_imports = True

[mypy-dncil.*]
ignore_missing_imports = True
