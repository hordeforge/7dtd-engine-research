# Static-type gate for the Python RE tooling and gates (mypy).
# Enforced by `make lint` locally and the ci.yml lint job; keep both on the
# same pinned version (see the workflow) so local and CI agree.
[mypy]
python_version = 3.12
strict = True
# UnityPy / dnfile / dncil ship no type information, and they are optional
# extras (the gates that need them exit 77 when absent), so their surfaces
# stay Any at the import boundary rather than gaining vendored stubs.
ignore_missing_imports = True
