name: ci
on: [push, pull_request]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs (dependabot's github-actions
      # ecosystem bumps both the SHA and the version comment weekly); a retagged
      # mutable ref must not be able to swap what CI executes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-docs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: install pinned analyzers
        run: |
          uv tool install ruff==0.16.4
          uv tool install mypy==2.3.1
          # Pinned so local `make lint` and CI agree (same policy as ruff);
          # ubuntu-latest's apt shellcheck trails the current release.
          # Checksum-gated like the Mono.Cecil pin: a swapped release artifact
          # must fail the download, not run in the lint job.
          sc_ver=0.11.0
          sc_sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${sc_ver}/shellcheck-v${sc_ver}.linux.x86_64.tar.xz" -o /tmp/sc.tar.xz
          echo "${sc_sha}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJ -C /tmp -f /tmp/sc.tar.xz
          sudo install "/tmp/shellcheck-v${sc_ver}/shellcheck" /usr/local/bin/shellcheck
      - run: make lint
