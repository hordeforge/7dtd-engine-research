name: ci
on: [push, pull_request]
# One run per ref: a force-push or a follow-up commit supersedes the previous
# run instead of burning a second runner on results nobody reads.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Both jobs only read the tree. Declaring the token scope here is what makes
# that true: without it the token inherits the repository default, which may be
# read/write, and a step running untrusted pull-request code could push.
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    # A wedged fuzz/parse step must fail the job, not hold a runner for the
    # six-hour default.
    timeout-minutes: 20
    steps:
      # Actions are pinned to immutable commit SHAs (dependabot's github-actions
      # ecosystem bumps both the SHA and the version comment weekly); a retagged
      # mutable ref must not be able to swap what CI executes.
      # persist-credentials: false keeps the token out of .git/config, so a
      # gate running untrusted pull-request code cannot push with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make test-docs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - name: install pinned analyzers
        run: |
          uv tool install ruff==0.16.4
          uv tool install mypy==2.3.1
          uv tool install yamllint==1.38.0
          # Pinned so local `make lint` and CI agree (same policy as ruff);
          # ubuntu-latest's apt shellcheck trails the current release.
          # Checksum-gated like the Mono.Cecil pin: a swapped release artifact
          # must fail the download, not run in the lint job.
          sc_ver=0.11.0
          sc_sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          # A private mktemp dir, not a fixed /tmp path: the checksum is the
          # supply-chain control, and a predictable filename would let whatever
          # else shares the runner's temp directory pre-aim the download.
          sc_dir="$(mktemp -d)"
          trap 'rm -rf "$sc_dir"' EXIT
          sc_base="https://github.com/koalaman/shellcheck/releases/download"
          curl -sSfL \
            "${sc_base}/v${sc_ver}/shellcheck-v${sc_ver}.linux.x86_64.tar.xz" \
            -o "$sc_dir/sc.tar.xz"
          echo "${sc_sha}  $sc_dir/sc.tar.xz" | sha256sum -c -
          tar -xJ -C "$sc_dir" -f "$sc_dir/sc.tar.xz"
          sudo install "$sc_dir/shellcheck-v${sc_ver}/shellcheck" /usr/local/bin/shellcheck
      - run: make lint
